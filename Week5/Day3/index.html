<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Page</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <h2>LOGO</h2>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Courses</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-text">
            <h1>Learn Web Development</h1>

            <p>
                Learn HTML, CSS, Python and Django
                and start building web applications.
            </p>

            <button>Get Started</button>
        </div>

        <div class="hero-image">
            <img src="photo.jpg" alt="Web development">
        </div>

    </section>


    <!-- Features / Courses -->
    <section class="courses">

        <h2>Our Courses</h2>

        <div class="course-grid">

            <div class="card">
                <h3>HTML</h3>
                <p>Learn the structure of web pages.</p>
            </div>

            <div class="card">
                <h3>CSS</h3>
                <p>Learn how to style responsive websites.</p>
            </div>

            <div class="card">
                <h3>Python</h3>
                <p>Learn programming with Python.</p>
            </div>

        </div>

    </section>

</body>
</html>
