{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Django Site{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav>
        <a href="{% url 'pages:home' %}">Home</a>
        <a href="{% url 'pages:about' %}">About</a>
        <a href="{% url 'pages:courses' %}">Courses</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Django Dynamic UI Lab</p>
    </footer>

</body>

</html>
