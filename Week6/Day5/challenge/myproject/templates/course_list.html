{% extends "base.html" %}

{% block title %}Courses{% endblock %}

{% block content %}

<h1>Courses</h1>

<ul>
    {% for course in courses %}
        <li>
            <a href="{% url 'courses:detail' course.slug %}">
                {{ course.title }}
            </a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
